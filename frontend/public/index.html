<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Docker Full Stack Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 20px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Docker Full Stack Application</h1>

        <p>Express Frontend → Flask Backend</p>

        <form id="todoForm">

            <label for="itemName">Item Name</label>

            <input type="text" id="itemName" name="itemName" placeholder="Enter item name" required>

            <label for="itemDescription">Item Description</label>

            <textarea id="itemDescription" name="itemDescription" placeholder="Enter item description" rows="5"
                required></textarea>

            <button type="submit">
                Submit
            </button>

        </form>

        <div id="result"></div>

    </div>

    <script>

        document
            .getElementById("todoForm")
            .addEventListener("submit", async function (event) {

                event.preventDefault();

                const itemName =
                    document.getElementById("itemName").value;

                const itemDescription =
                    document.getElementById("itemDescription").value;

                try {

                    const response = await fetch("/submit", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            itemName: itemName,
                            itemDescription: itemDescription
                        })

                    });

                    const data = await response.json();

                    document.getElementById("result").innerText =
                        data.message;

                } catch (error) {

                    document.getElementById("result").innerText =
                        "Error submitting data";

                }

            });

    </script>

</body>

</html>
